apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-app-config
data:
  log-level: "INFO"
  environment: "development"
  tracing-enabled: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-aggregator
  labels:
    app: weather-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-aggregator
  template:
    metadata:
      labels:
        app: weather-aggregator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: weather-aggregator
          image: image-registry.openshift-image-registry.svc:5000/weather-demo/weather-aggregator:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: weather-app-config
                  key: log-level
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: weather-app-config
                  key: environment
            - name: METRICS_ENABLED
              value: "true"
            - name: TRACING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: weather-app-config
                  key: tracing-enabled
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: weather-aggregator
  labels:
    app: weather-aggregator
spec:
  selector:
    app: weather-aggregator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: weather-aggregator
  labels:
    app: weather-aggregator
spec:
  to:
    kind: Service
    name: weather-aggregator
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: weather-aggregator
  labels:
    app: weather-aggregator
spec:
  output:
    to:
      kind: ImageStreamTag
      name: weather-aggregator:latest
  source:
    type: Git
    git:
      uri: https://github.com/atknvardar/stajdevopsproje.git
      ref: main
    contextDir: .
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers:
    - type: GitHub
      github:
        secret: github-webhook-secret
    - type: ConfigChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: weather-aggregator
  labels:
    app: weather-aggregator