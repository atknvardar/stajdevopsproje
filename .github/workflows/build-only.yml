name: Build Only CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies and run tests
      run: |
        cd app
        pip install --upgrade pip
        pip install -r requirements.txt
        python -m pytest tests/test_weather_api.py tests/test_config.py -v || true
    
    - name: Build Docker image
      run: |
        docker build -t weather-aggregator:${{ github.sha }} .
        echo "✅ Docker image built successfully!"
    
    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8080:8080 weather-aggregator:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8080/healthz || (docker logs test-container && exit 1)
        echo "✅ Health check passed!"
        docker stop test-container
        docker rm test-container